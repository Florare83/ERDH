<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>El Rincón de Hermes — Contacto</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link href="css/estilos.css" rel="stylesheet" />
    </head>
    <body>
        <nav class="navbar navbar-expand-md navbar-erdh navbar-dark py-3">
            <div class="container">
                             <img src=img/logo.png  alt="Logo de El Rincón de Hermes" />
                <a class="navbar-brand" href="index.html">El Rincón de Hermes</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menú de navegación"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="menuPrincipal">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="index.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="club.html">Club</a></li>
                        <li class="nav-item"><a class="nav-link" href="juegos.html">Juegos</a></li>
                                                <li class="nav-item">
                            <a class="nav-link" href="faq.html">FAQ</a>
                        </li>     
                        <li class="nav-item">
                            <a
                                class="nav-link btn-contacto active"
                                aria-current="page"
                                href="contacto.html"
                                >Contacto</a
                            >
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <h1 class="titulo-listado h3">Contacto</h1>
                    <p class="subtitulo-listado mb-4">
                        Escribinos tu mensaje y te responderemos lo antes posible.
                    </p>

                    <form class="form-contacto" action="#" method="post" novalidate>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                name="nombre"
                                placeholder="Tu nombre"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label for="asunto" class="form-label">Asunto</label>
                            <input
                                type="text"
                                class="form-control"
                                id="asunto"
                                name="asunto"
                                placeholder="Asunto del mensaje"
                                required
                            />
                        </div>

                        <div class="mb-4">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea
                                class="form-control"
                                id="mensaje"
                                name="mensaje"
                                rows="5"
                                placeholder="Escribe tu mensaje"
                                required
                            ></textarea>
                        </div>

                        <button type="submit" class="btn btn-categoria">Enviar</button>
                    </form>
                </div>
            </div>
        </main>

        <footer class="footer-erdh py-4 mt-5">
            <div
                class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2"
            >
                <span>&copy; 2026 El Rincón de Hermes</span>
                <a href="contacto.html">Contactanos</a>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
